services:
  falco:
    image: falcosecurity/falco:latest
    container_name: falco
    restart: unless-stopped
    environment:
      TZ: America/New_York
    privileged: true
    command:
      - /usr/bin/falco
      - -o
      - engine.kind=modern_ebpf
      - -o
      - json_output=true
      - -o
      - json_include_output_property=true
      - -o
      - stdout_output.enabled=true
      - -o
      - file_output.enabled=true
      - -o
      - file_output.filename=/var/log/falco/events.json
      - -o
      - http_output.enabled=true
      - -o
      - http_output.url=http://kingdom-manager:8080/api/security/falco?token=kingdom-falco-2026-change-this
      - -o
      - webserver.enabled=true
      - -o
      - webserver.listen_port=8765
      - -o
      - webserver.k8s_healthz_endpoint=/healthz
    volumes:
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - falco-logs:/var/log/falco
    networks:
      - security

volumes:
  falco-logs:
    name: falco-logs

networks:
  security:
    external: true
