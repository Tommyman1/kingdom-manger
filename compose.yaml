services:
  kingdom-manager:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: kingdom-manager:1.7.0
    container_name: kingdom-manager
    restart: unless-stopped
    environment:
      TZ: America/New_York
      KM_DATA_DIR: /data
      KM_API_TOKEN: "kingdom-manager-change-this-2026"
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      RECOVERY_DOCKER_HOST: tcp://recovery-socket-proxy:2375
      KM_QUARANTINE_NETWORK: kingdom-quarantine
      KM_CHECK_SECONDS: "300"
      KM_IDLE_CPU_PERCENT: "3.0"
      KM_IDLE_MINUTES: "20"
      KM_DECISION_WINDOW_SECONDS: "900"
      KM_DECISION_DEBOUNCE_SECONDS: "120"
      KM_TRIVY_CONTEXT_SECONDS: "604800"
      KM_RECOVERY_APPROVAL_TTL_SECONDS: "900"
      TRIVY_RUNNER: kingdom-manager-trivy
      DISCORD_WEBHOOK_URL: ""
      N8N_WEBHOOK_URL: ""
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CROWDSEC_URL: "http://172.24.0.1:8080"
      CROWDSEC_API_KEY: "PASTE_YOUR_EXISTING_KINGDOM_MANAGER_BOUNCER_KEY_HERE"
      FALCO_WEBHOOK_SECRET: "kingdom-falco-2026-change-this"
      FALCO_HOST: falco
      FALCO_HEALTH_PORT: "8765"
      TRIVY_AUTO_SCAN_ENABLED: "true"
      TRIVY_AUTO_SCAN_EVERY_SECONDS: "1800"
      TRIVY_AUTO_SCAN_START_DELAY_SECONDS: "45"
      TRIVY_RESCAN_SECONDS: "604800"
      KM_NOTIFY_MIN_SEVERITY: "high"
      KM_DAILY_REPORT_ENABLED: "true"
      KM_DAILY_REPORT_HOUR: "8"
      KM_WEEKLY_REPORT_WEEKDAY: "0"
      KM_WEEKLY_REPORT_HOUR: "9"
      KM_SCORE_HISTORY_INTERVAL_SECONDS: "900"
    volumes:
      - kingdom-manager-data:/data
    networks:
      - proxy
      - security
      - kingdom-manager-internal
    depends_on:
      docker-socket-proxy:
        condition: service_started
      recovery-socket-proxy:
        condition: service_started
      trivy-runner:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      homepage.group: Network
      homepage.name: Kingdom Manager
      homepage.description: Incident response, controlled recovery, security decisions, scans, and container lifecycle
      homepage.icon: mdi-crown
      homepage.href: https://kingdom-manager-tail.kingdom.local

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: kingdom-manager-docker-api
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 1
      DELETE: 0
      EXEC: 1
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kingdom-manager-internal
    security_opt:
      - no-new-privileges:true

  recovery-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: kingdom-manager-recovery-docker-api
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      EVENTS: 0
      PING: 1
      VERSION: 1
      POST: 1
      DELETE: 1
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kingdom-manager-internal
    security_opt:
      - no-new-privileges:true

  trivy-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: kingdom-manager-trivy-docker-api
    restart: unless-stopped
    environment:
      CONTAINERS: 0
      IMAGES: 1
      INFO: 1
      NETWORKS: 0
      EVENTS: 0
      PING: 1
      VERSION: 1
      POST: 0
      DELETE: 0
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - trivy-control
    security_opt:
      - no-new-privileges:true

  trivy-runner:
    image: aquasec/trivy:0.74.0
    container_name: kingdom-manager-trivy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    environment:
      TZ: America/New_York
      TRIVY_CACHE_DIR: /root/.cache/trivy
      DOCKER_HOST: tcp://trivy-socket-proxy:2375
    volumes:
      - trivy-cache:/root/.cache/trivy
    networks:
      - kingdom-manager-internal
      - trivy-control
      - kingdom-manager-egress
    depends_on:
      trivy-socket-proxy:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  kingdom-manager-data:
    name: kingdom-manager-data
  trivy-cache:
    name: kingdom-manager-trivy-cache

networks:
  proxy:
    external: true
  security:
    external: true
  kingdom-manager-internal:
    name: kingdom-manager-internal
    internal: true
  kingdom-quarantine:
    name: kingdom-quarantine
    internal: true
  kingdom-manager-egress:
    name: kingdom-manager-egress
  trivy-control:
    name: kingdom-manager-trivy-control
    internal: true
