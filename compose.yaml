services:
  kingdom-manager:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: kingdom-manager:3.1.8
    container_name: kingdom-manager
    restart: unless-stopped
    environment:
      TZ: America/New_York
      KM_DATA_DIR: /data
      KM_API_TOKEN: "kingdom-manager-change-this-2026"
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      RECOVERY_DOCKER_HOST: tcp://recovery-socket-proxy:2375
      KM_QUARANTINE_NETWORK: kingdom-quarantine
      KM_CHECK_SECONDS: "300"
      KM_IDLE_CPU_PERCENT: "3.0"
      KM_IDLE_MINUTES: "20"
      KM_DECISION_WINDOW_SECONDS: "900"
      KM_DECISION_DEBOUNCE_SECONDS: "120"
      KM_TRIVY_CONTEXT_SECONDS: "604800"
      KM_RECOVERY_APPROVAL_TTL_SECONDS: "900"
      KM_RECOVERY_OBSERVATION_SECONDS: "30"
      KM_RECOVERY_BLOCK_ON_CRITICAL_CVE: "true"
      KM_RECOVERY_ALLOW_DATABASES: "false"
      TRIVY_RUNNER: kingdom-manager-trivy
      TRIVY_EXEC_DOCKER_HOST: tcp://trivy-exec-proxy:2375
      KM_DOCKER_CACHE_TTL_SECONDS: "12"
      KM_DOCKER_CACHE_MAX_STALE_SECONDS: "300"
      KM_SENSOR_CACHE_TTL_SECONDS: "15"
      KM_API_SNAPSHOT_TTL_SECONDS: "10"
      KM_DASHBOARD_REFRESH_SECONDS: "15"
      KM_MONITOR_SCHEDULER_OFFSET_SECONDS: "20"
      KM_SCORE_SCHEDULER_OFFSET_SECONDS: "120"
      KM_TRIVY_SCHEDULER_OFFSET_SECONDS: "420"
      KM_DRIFT_SCHEDULER_OFFSET_SECONDS: "1140"
      KM_SENSOR_SCHEDULER_OFFSET_SECONDS: "45"
      DISCORD_WEBHOOK_URL: ""
      KM_DASHBOARD_URL: "https://kingdom-manager-tail.kingdom.local"
      DISCORD_MENTION_ROLE_ID: ""
      DISCORD_NOTIFY_UPDATES: "true"
      DISCORD_NOTIFY_RECOVERY: "true"
      DISCORD_NOTIFY_SENSOR_FAILURES: "true"
      N8N_WEBHOOK_URL: ""
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CROWDSEC_URL: "http://172.24.0.1:8080"
      CROWDSEC_API_KEY: "PASTE_YOUR_EXISTING_KINGDOM_MANAGER_BOUNCER_KEY_HERE"
      FALCO_WEBHOOK_SECRET: "kingdom-falco-2026-change-this"
      FALCO_HOST: falco
      FALCO_HEALTH_PORT: "8765"
      TRIVY_AUTO_SCAN_ENABLED: "true"
      TRIVY_AUTO_SCAN_EVERY_SECONDS: "1800"
      TRIVY_AUTO_SCAN_START_DELAY_SECONDS: "45"
      TRIVY_RESCAN_SECONDS: "604800"
      KM_NOTIFY_MIN_SEVERITY: "high"
      KM_DAILY_REPORT_ENABLED: "true"
      KM_DAILY_REPORT_HOUR: "8"
      KM_WEEKLY_REPORT_WEEKDAY: "0"
      KM_WEEKLY_REPORT_HOUR: "9"
      KM_SCORE_HISTORY_INTERVAL_SECONDS: "900"
      KM_BASELINE_DAYS: "7"
      KM_BASELINE_STABLE_MIN_EVENTS: "100"
      KM_BASELINE_STABLE_MIN_HOURS: "12"
      KM_BASELINE_STABLE_ATTENUATION: "20"
      KM_BASELINE_LEARNING_ATTENUATION: "8"
      KM_KNOWN_GOOD_RESIDUAL_RISK: "5"
      KM_KNOWN_GOOD_MAX_ATTENUATION: "45"
      KM_SENSOR_FAILURE_GRACE_SECONDS: "120"
      KM_PLAYBOOKS_ENABLED: "true"
      KM_PLAYBOOK_AUTO_EVIDENCE: "true"
      KM_PLAYBOOK_AUTO_SCAN: "true"
      KM_PLAYBOOK_AUTO_ISOLATE: "false"
      KM_PLAYBOOK_AUTO_RECOVER: "false"
      KM_IGNORE_HTTP_TRANSPORT_ERRORS: "true"
      KM_UPDATE_ENGINE_ENABLED: "true"
      KM_UPDATE_CHECK_SECONDS: "21600"
      KM_UPDATE_START_DELAY_SECONDS: "180"
      KM_UPDATE_OBSERVATION_SECONDS: "60"
      KM_UPDATE_REQUIRE_TRIVY: "true"
      KM_UPDATE_BLOCK_CRITICAL_CVE: "true"
      KM_UPDATE_BLOCK_HIGH_CVE: "false"
      KM_UPDATE_AUTO_APPLY: "true"
      KM_UPDATE_ALLOW_STATEFUL: "false"
      KM_DRIFT_SCAN_ENABLED: "true"
      KM_DRIFT_SCAN_SECONDS: "1800"
      KM_BACKUP_MAX_AGE_HOURS: "48"
      KM_AUTO_SAFE_PLAYBOOKS: "true"
      KM_ROLLBACK_RETENTION: "10"
      # Optional Portainer compose capture. Leave blank unless configured.
      PORTAINER_URL: ""
      PORTAINER_API_KEY: ""
      PORTAINER_STACK_ID: ""
      KM_COMPOSE_SNAPSHOT_PATH: ""
    volumes:
      - kingdom-manager-data:/data
    networks:
      - proxy
      - security
      - kingdom-manager-internal
    depends_on:
      docker-socket-proxy:
        condition: service_started
      recovery-socket-proxy:
        condition: service_started
      trivy-exec-proxy:
        condition: service_started
      trivy-runner:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      homepage.group: Network
      homepage.name: Kingdom Manager
      homepage.description: Security intelligence, investigation, controlled recovery, decisions, scans, and container lifecycle
      homepage.icon: mdi-crown
      homepage.href: https://kingdom-manager-tail.kingdom.local

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: kingdom-manager-docker-api
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 1
      DELETE: 0
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kingdom-manager-internal
    security_opt:
      - no-new-privileges:true

  recovery-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: kingdom-manager-recovery-docker-api
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      EVENTS: 0
      PING: 1
      VERSION: 1
      POST: 1
      DELETE: 1
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kingdom-manager-internal
    security_opt:
      - no-new-privileges:true

  trivy-exec-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: kingdom-manager-trivy-exec-api
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      EVENTS: 0
      PING: 1
      VERSION: 1
      POST: 1
      DELETE: 0
      EXEC: 1
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kingdom-manager-internal
    security_opt:
      - no-new-privileges:true

  trivy-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: kingdom-manager-trivy-docker-api
    restart: unless-stopped
    environment:
      CONTAINERS: 0
      IMAGES: 1
      INFO: 1
      NETWORKS: 0
      EVENTS: 0
      PING: 1
      VERSION: 1
      POST: 0
      DELETE: 0
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - trivy-control
    security_opt:
      - no-new-privileges:true

  trivy-runner:
    image: aquasec/trivy:0.74.0
    container_name: kingdom-manager-trivy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    environment:
      TZ: America/New_York
      TRIVY_CACHE_DIR: /root/.cache/trivy
      DOCKER_HOST: tcp://trivy-socket-proxy:2375
    volumes:
      - trivy-cache:/root/.cache/trivy
    networks:
      - kingdom-manager-internal
      - trivy-control
      - kingdom-manager-egress
    depends_on:
      trivy-socket-proxy:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  kingdom-manager-data:
    name: kingdom-manager-data
  trivy-cache:
    name: kingdom-manager-trivy-cache

networks:
  proxy:
    external: true
  security:
    external: true
  kingdom-manager-internal:
    name: kingdom-manager-internal
    internal: true
  kingdom-quarantine:
    name: kingdom-quarantine
    internal: true
  kingdom-manager-egress:
    name: kingdom-manager-egress
  trivy-control:
    name: kingdom-manager-trivy-control
    internal: true
